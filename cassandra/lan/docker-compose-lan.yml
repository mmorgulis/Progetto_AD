version: '3.8'
services:
  cassandra-node:
    image: cassandra:4.1
    container_name: cassandra-lan-node
    ports:
      - "9042:9042"
      - "7000:7000"
    environment:
      - CASSANDRA_CLUSTER_NAME=UnimiBClusterLAN
      - CASSANDRA_SEEDS=192.168.1.34 
      - CASSANDRA_BROADCAST_ADDRESS=${MY_LOCAL_IP} # Preso dal file .env locale
      - CASSANDRA_BROADCAST_RPC_ADDRESS=${MY_LOCAL_IP} # Preso dal file .env locale